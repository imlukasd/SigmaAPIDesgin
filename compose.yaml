services:
  postgres:
    image: postgres:17-alpine
    container_name: corebe-postgres
    environment:
      POSTGRES_DB: corebe
      POSTGRES_USER: corebe
      POSTGRES_PASSWORD: corebe_dev_password
    ports:
      - "5432:5432"
    volumes:
      - corebe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebe -d corebe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  corebe_postgres_data:
