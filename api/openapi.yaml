openapi: 3.1.0
info:
  title: CoreBE API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: API process is alive
  /readyz:
    get:
      summary: Readiness check
      responses:
        "200":
          description: API is ready to receive traffic
        "503":
          description: API dependency is not ready
  /v1:
    get:
      summary: API root
      responses:
        "200":
          description: API metadata
  /v1/payments/capabilities:
    get:
      summary: Payment module planning marker
      responses:
        "200":
          description: Payment design principles for later implementation

